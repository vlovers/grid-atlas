name: Pinned F1DB real-archive acceptance
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'tests/real-archive/**'
      - 'playwright.real-archive.config.ts'
      - 'packages/database/**'
      - 'packages/data-importer/**'
      - 'scripts/import-f1db.sh'
      - 'scripts/verify-real-archive.py'
      - 'scripts/audit-encyclopedia.py'
      - 'tests/test_import_identity_details.py'
      - 'tests/test_encyclopedia_audit.py'
      - 'scripts/prepare_bulk_driver_cohort.py'
      - 'scripts/prepare_editorial_batch.py'
      - 'tests/test_bulk_driver_cohort.py'
      - 'scripts/select-real-archive-stress.py'
      - 'scripts/verify-media-identities.py'
      - 'scripts/editorial-circuit-crosswalk.py'
      - 'tests/test_editorial_circuit_crosswalk.py'
      - 'scripts/audit-cross-era-identities.py'
      - 'tests/test_audit_cross_era_identities.py'
      - 'docs/media/cross-era-staging.json'
      - 'docs/media/pilot-identities.json'
      - '.github/workflows/real-archive.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'tests/real-archive/**'
      - 'playwright.real-archive.config.ts'
      - 'packages/database/**'
      - 'packages/data-importer/**'
      - 'scripts/import-f1db.sh'
      - 'scripts/verify-real-archive.py'
      - 'scripts/audit-encyclopedia.py'
      - 'scripts/select-real-archive-stress.py'
      - 'scripts/verify-media-identities.py'
      - 'scripts/editorial-circuit-crosswalk.py'
      - 'tests/test_editorial_circuit_crosswalk.py'
      - 'scripts/audit-cross-era-identities.py'
      - 'tests/test_audit_cross_era_identities.py'
      - 'docs/media/cross-era-staging.json'
      - 'docs/media/pilot-identities.json'
      - '.github/workflows/real-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grid_atlas
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: grid_atlas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U grid_atlas -d grid_atlas"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://grid_atlas:integration_only@127.0.0.1:5432/grid_atlas
      GRID_ATLAS_NEXT_DIST_DIR: .next-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned toolchain
        run: |
          corepack enable && corepack prepare pnpm@10.18.3 --activate
          pnpm install --frozen-lockfile
          sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Fetch pinned archive with published checksum
        run: |
          mkdir -p /tmp/grid-atlas-f1db
          curl --fail --location --retry 3 --retry-delay 2 https://github.com/f1db/f1db/releases/download/v2026.17.0/checksums_sha256.txt -o /tmp/grid-atlas-f1db/checksums_sha256.txt
          curl --fail --location --retry 3 --retry-delay 2 https://github.com/f1db/f1db/releases/download/v2026.17.0/f1db-json-splitted.zip -o /tmp/grid-atlas-f1db/f1db-json-splitted.zip
      - name: Audit five editorial circuit event-layout mappings
        run: |
          python3 -m unittest discover -s tests -p 'test_editorial_circuit_crosswalk.py' -v
          python3 scripts/editorial-circuit-crosswalk.py \
            --archive /tmp/grid-atlas-f1db/f1db-json-splitted.zip \
            --checksums /tmp/grid-atlas-f1db/checksums_sha256.txt \
            --output /tmp/grid-atlas-editorial-circuit-crosswalk.json
      - name: Upload five-circuit crosswalk evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-editorial-circuit-crosswalk
          path: /tmp/grid-atlas-editorial-circuit-crosswalk.json
          retention-days: 14
          if-no-files-found: warn
      - name: Verify media subject and historical circuit-layout references
        run: python3 scripts/verify-media-identities.py --archive /tmp/grid-atlas-f1db/f1db-json-splitted.zip --checksums /tmp/grid-atlas-f1db/checksums_sha256.txt
      - name: Audit cross-era media identities against exact F1DB source rows
        run: |
          python3 -m unittest discover -s tests -p 'test_audit_cross_era_identities.py' -v
          python3 scripts/audit-cross-era-identities.py \
            --archive /tmp/grid-atlas-f1db/f1db-json-splitted.zip \
            --checksums /tmp/grid-atlas-f1db/checksums_sha256.txt \
            --output /tmp/grid-atlas-cross-era-identities.json
      - name: Upload unpublished identity audit
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-cross-era-identity-audit
          path: /tmp/grid-atlas-cross-era-identities.json
          retention-days: 7
          if-no-files-found: error
      - name: Import genuine pinned F1DB release twice into ephemeral PostgreSQL
        run: |
          bash scripts/import-f1db.sh /tmp/grid-atlas-f1db/f1db-json-splitted.zip /tmp/grid-atlas-f1db/checksums_sha256.txt
          bash scripts/import-f1db.sh /tmp/grid-atlas-f1db/f1db-json-splitted.zip /tmp/grid-atlas-f1db/checksums_sha256.txt
      - name: Generate 50-driver unpublished evidence cohort
        run: |
          python3 scripts/prepare_bulk_driver_cohort.py --archive /tmp/grid-atlas-f1db/f1db-json-splitted.zip --checksums /tmp/grid-atlas-f1db/checksums_sha256.txt --output /tmp/grid-atlas-bulk-fifty
          python3 -m unittest discover -s tests -p 'test_bulk_driver_cohort.py' -v
      - name: Upload 50-driver research pack
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-driver-research-fifty
          path: /tmp/grid-atlas-bulk-fifty/
          retention-days: 7
          if-no-files-found: error
      - name: Build production API
        run: pnpm --filter @grid-atlas/api build
      - name: Cross-check real archive SQL and reciprocal API
        run: |
          HOST=127.0.0.1 PORT=3001 pnpm --filter @grid-atlas/api start > /tmp/grid-atlas-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true; cat /tmp/grid-atlas-api.log' EXIT
          python3 scripts/verify-real-archive.py

      - name: Build Next.js web and install browser
        env:
          API_BASE_URL: http://127.0.0.1:3350
        run: |
          pnpm --filter @grid-atlas/web build
          pnpm exec playwright install --with-deps chromium
      - name: Select a real pair for browser navigation
        run: |
          PAIR="$(psql "$DATABASE_URL" -X -t -A -v ON_ERROR_STOP=1 -c "SELECT CONCAT_WS('|',r.season_year,rr.driver_id,rr.constructor_id) FROM historical_race_results rr JOIN historical_races r ON r.id=rr.race_id GROUP BY r.season_year,rr.driver_id,rr.constructor_id ORDER BY r.season_year,rr.driver_id,rr.constructor_id LIMIT 1")"
          IFS='|' read -r YEAR DRIVER CONSTRUCTOR <<< "$PAIR"
          test -n "$YEAR" && test -n "$DRIVER" && test -n "$CONSTRUCTOR"
          echo "SMOKE_YEAR=$YEAR" >> "$GITHUB_ENV"
          echo "SMOKE_DRIVER_ID=$DRIVER" >> "$GITHUB_ENV"
          echo "SMOKE_CONSTRUCTOR_ID=$CONSTRUCTOR" >> "$GITHUB_ENV"
      - name: Audit every archive entity, season API and UK/EN canonical profile
        run: |
          HOST=127.0.0.1 PORT=3350 node apps/api/dist/main.js > /tmp/encyclopedia-api.log 2>&1 &
          API_PID=$!
          API_BASE_URL=http://127.0.0.1:3350 SITE_URL=http://127.0.0.1:3351 node apps/web/node_modules/next/dist/bin/next start apps/web --hostname 127.0.0.1 --port 3351 > /tmp/encyclopedia-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true; wait "$API_PID" "$WEB_PID" 2>/dev/null || true; cat /tmp/encyclopedia-api.log; tail -40 /tmp/encyclopedia-web.log' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3350/api/health && curl --fail --silent http://127.0.0.1:3351/en > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/audit-encyclopedia.py --archive /tmp/grid-atlas-f1db/f1db-json-splitted.zip --checksums /tmp/grid-atlas-f1db/checksums_sha256.txt --api-url http://127.0.0.1:3350/api --web-url http://127.0.0.1:3351 --output /tmp/encyclopedia-coverage.json
      - name: Select real high-degree and long-name cases
        run: python3 scripts/select-real-archive-stress.py
      - name: Test actual imported archive via production web browser
        run: pnpm exec playwright test --config playwright.real-archive.config.ts
      - name: Upload full coverage audit and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-coverage-and-screenshots
          path: |
            /tmp/encyclopedia-coverage.json
            test-results/
          retention-days: 14
      - name: Upload real archive browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-archive-browser-failure
          path: test-results/
          retention-days: 7
