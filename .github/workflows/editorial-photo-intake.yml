name: Stage editorial photo candidates

on:
  pull_request:
    paths:
      - scripts/editorial-media-intake.mjs
      - scripts/editorial-photo-discovery.mjs
      - .github/workflows/editorial-photo-intake.yml
  push:
    branches:
      - editorial/people-who-changed-f1-20261025
    paths:
      - scripts/editorial-media-intake.mjs
      - scripts/editorial-photo-discovery.mjs
      - .github/workflows/editorial-photo-intake.yml
  workflow_dispatch:
    inputs:
      story:
        description: Historical photo candidate to stage
        required: true
        type: choice
        options:
          - all
          - vettel-monza-2008
          - brawn-2009

permissions:
  contents: read

jobs:
  stage:
    name: Download candidates for manual rights review
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Read-only discovery; no job token with write privileges is available here.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Discover candidates for all ten stories (unreviewed)
        if: github.event_name != 'push'
        run: node scripts/editorial-photo-discovery.mjs
      # Full-resolution intake makes further Commons API calls and frequently hits
      # HTTP 429 when triggered automatically for every PR commit. Discovery is
      # enough for PR review; manual intake remains a separate, explicit gate.
      - name: Fetch Commons candidates and provenance
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.story }}" = "all" ]; then
            node scripts/editorial-media-intake.mjs --all
          else
            node scripts/editorial-media-intake.mjs --slug "${{ inputs.story }}"
          fi
      - name: Upload private review package (not published)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: editorial-photo-review-${{ github.run_id }}
          path: .grid-atlas/media-review/
          if-no-files-found: error
          retention-days: 7

  quarantine:
    name: Quarantine unreviewed public images
    if: github.event_name == 'push' && github.ref_name == 'editorial/people-who-changed-f1-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only this push-only job can write; do not run branch scripts with this token.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Remove accidentally published unreviewed media
        if: github.event_name == 'push' && github.ref_name == 'editorial/people-who-changed-f1-20261025'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in apps/web/public/media/editorial/vettel-monza-2008.jpg apps/web/public/media/editorial/brawn-2009.jpg; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              git rm -- "$file"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "fix(media): quarantine unreviewed photo files outside public assets"
            # Git's credential helper reads the token from this step's environment.
            # The token is never written to .git/config or interpolated into argv.
            git -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:editorial/people-who-changed-f1-20261025
          fi
