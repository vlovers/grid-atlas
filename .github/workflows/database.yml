name: Database integration
on:
  pull_request:
    paths:
      - 'packages/database/**'
      - '.github/workflows/database.yml'
  push:
    branches: [main]
    paths:
      - 'packages/database/**'
permissions:
  contents: read
jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grid_atlas
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: grid_atlas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U grid_atlas -d grid_atlas"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://grid_atlas:integration_only@localhost:5432/grid_atlas
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test lineage identity preflight guards
        run: python3 packages/database/scripts/test-audit-lineage-manifest-identities.py
      - name: Test exact identity resolution against PostgreSQL
        run: python3 packages/database/scripts/test-lineage-identity-integration.py
      - name: Test forward migration on fresh PostgreSQL
        run: |
          bash packages/database/scripts/test-versioned-migrations.sh
      - name: Test editorial publication constraints against PostgreSQL
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f packages/database/scripts/test-editorial-constraints.sql
      - name: Test editorial approval invalidation on PostgreSQL
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f packages/database/scripts/test-editorial-review-invalidation.sql
      - name: Test proposed lineage importer against PostgreSQL
        run: bash packages/database/scripts/test-proposed-lineage-import.sh
