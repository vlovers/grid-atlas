name: Race story editorial research checks

on:
  pull_request:
    paths:
      - 'docs/editorial/race-arcs/**'
      - 'tests/test_race_story_research.py'
      - 'tests/test_race_story_underdogs.py'
      - '.github/workflows/race-editorial-research.yml'
  push:
    branches: [main]
    paths:
      - 'docs/editorial/race-arcs/**'
      - 'tests/test_race_story_research.py'
      - '.github/workflows/race-editorial-research.yml'

permissions:
  contents: read

jobs:
  structure-and-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify bilingual race research structure (not editorial approval)
        run: python3 -m unittest tests/test_race_story_research.py tests/test_race_story_underdogs.py -v
