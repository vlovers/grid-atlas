name: F1DB audit script

on:
  pull_request:
    paths:
      - 'scripts/audit_f1db.py'
      - 'tests/test_f1db_audit.py'
      - '.github/workflows/f1db-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_f1db.py'
      - 'tests/test_f1db_audit.py'

permissions:
  contents: read

jobs:
  offline-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test release audit script with synthetic fixtures
        run: python3 -m unittest discover -s tests -p 'test_f1db_audit.py' -v
