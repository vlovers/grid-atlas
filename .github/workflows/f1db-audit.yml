name: F1DB audit script

on:
  pull_request:
    paths:
      - 'scripts/audit_f1db.py'
      - 'tests/test_f1db_audit.py'
      - '.github/workflows/f1db-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_f1db.py'
      - 'tests/test_f1db_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test audit script with synthetic fixtures
        run: python3 -m unittest discover -s tests -p 'test_f1db_audit.py' -v

  pinned-release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned official GitHub release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/f1db-release
          base="https://github.com/f1db/f1db/releases/download/v2026.17.0"
          curl --fail --location --retry 3 --retry-delay 2 "$base/checksums_sha256.txt" -o /tmp/f1db-release/checksums_sha256.txt
          curl --fail --location --retry 3 --retry-delay 2 "$base/f1db-json-splitted.zip" -o /tmp/f1db-release/f1db-json-splitted.zip
      - name: Audit published split JSON archive
        run: |
          python3 scripts/audit_f1db.py \
            --archive /tmp/f1db-release/f1db-json-splitted.zip \
            --checksums /tmp/f1db-release/checksums_sha256.txt \
            --report f1db-audit-report.json
      - name: Publish summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1db-audit-report
          path: f1db-audit-report.json
          if-no-files-found: ignore
          retention-days: 14
