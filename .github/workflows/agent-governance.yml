name: Agent governance contract
# Required PR checks must run even for code-only changes. Avoid path filters
# that could leave required checks pending, but cancel superseded PR runs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a main push or an explicitly requested manual verification.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test test/check-governance.test.mjs
      - run: node scripts/check-governance.mjs
