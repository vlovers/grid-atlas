name: Historical API
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'scripts/smoke-deployment.mjs'
      - 'packages/database/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'scripts/smoke-deployment.mjs'
      - 'packages/database/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grid_atlas
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: grid_atlas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U grid_atlas -d grid_atlas"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://grid_atlas:integration_only@localhost:5432/grid_atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations
        run: python3 packages/database/scripts/migrate.py
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.18.3 --activate
      - name: Install API dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build API
        run: pnpm --filter @grid-atlas/api build
      - name: Test verified-only lineage over HTTP and PostgreSQL
        run: pnpm --filter @grid-atlas/api test:integration
      - name: Verify HTTP controller declarations
        run: test -f apps/api/dist/historical.controller.js
      - name: Seed minimal historical fixtures
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO data_sources(slug,homepage_url,attribution) VALUES('fixture','https://example.org','Test only');
          INSERT INTO source_releases(source_id,release_tag,artifact_name,sha256)
          VALUES(1,'synthetic','ci-fixture.json',repeat('a',64));
          INSERT INTO external_identities(source_id,entity_kind,external_id)
          VALUES (1,'driver','driver-fixture'),(1,'constructor','constructor-fixture'),(1,'circuit','circuit-fixture'),(1,'race','race-fixture');
          INSERT INTO historical_drivers(external_identity_id,display_name) VALUES(1,'Fixture Driver');
          INSERT INTO historical_constructors(external_identity_id,display_name) VALUES(2,'Fixture Constructor');
          INSERT INTO historical_circuits(external_identity_id,display_name) VALUES(3,'Fixture Circuit');
          INSERT INTO historical_seasons(year) VALUES(1950);
          INSERT INTO historical_races(external_identity_id,season_year,round,circuit_id,race_date,official_name)
          VALUES(4,1950,1,1,'1950-05-13','Fixture Grand Prix');
          INSERT INTO historical_race_results(race_id,driver_id,constructor_id,position_display_order,position_number,position_text,driver_number,points)
          VALUES(1,1,1,1,1,'1','2',9);
          SQL
      - name: Smoke-test HTTP endpoints and input validation
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @grid-atlas/api start >/tmp/grid-atlas-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true; cat /tmp/grid-atlas-api.log' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/ready >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          node scripts/smoke-deployment.mjs --api-origin http://127.0.0.1:3001
          curl -fsS http://127.0.0.1:3001/api/seasons | python3 -c 'import json,sys; assert json.load(sys.stdin)["data"][0]["year"]==1950'
          curl -fsS http://127.0.0.1:3001/api/seasons/1950/races | python3 -c 'import json,sys; assert json.load(sys.stdin)["data"][0]["official_name"]=="Fixture Grand Prix"'
          curl -fsS http://127.0.0.1:3001/api/drivers | python3 -c 'import json,sys; assert json.load(sys.stdin)["data"][0]["name"]=="Fixture Driver"'
          curl -fsS http://127.0.0.1:3001/api/races/1/results | python3 -c 'import json,sys; assert json.load(sys.stdin)["data"][0]["driver"]=="Fixture Driver"'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3001/api/drivers?limit=1000')" = 400
