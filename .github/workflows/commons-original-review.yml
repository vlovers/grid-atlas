name: Commons originals research preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-original-photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect pinned Commons originals (research-only)
        id: originals
        continue-on-error: true
        run: node scripts/preview-commons-originals.mjs
      - name: Summarize verified photograph originals
        if: always()
        run: |
          if [ -f .grid-atlas/media-review/status.json ]; then
            node -e '
              const fs=require("node:fs");
              const data=JSON.parse(fs.readFileSync(".grid-atlas/media-review/status.json","utf8"));
              const count=data.entries.filter(x=>x.success).length;
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                "### Original photographic evidence (NOT publication approval)\n\n" +
                "Verified originals: **" + count + "/" + data.entries.length + "**\n\n" +
                data.entries.map(x=>"- "+x.id+": "+(x.success?"checksum verified":"BLOCKED — "+x.error)).join("\n")+"\n\n" +
                "This is an isolated research artifact; neither the production media registry nor public assets were changed.\n");
            '
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grid-atlas-research-photo-contact-sheet
          path: .grid-atlas/media-review/
          if-no-files-found: error
          retention-days: 7
      - name: Fail closed if a source original is not verified
        if: steps.originals.outcome != 'success'
        run: exit 1
