name: Commons originals research preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/commons-original-review.yml'
      - 'scripts/preview-commons-originals.mjs'
      - 'docs/media/commons-original-evidence.json'
      - 'docs/media/verified-original-observations.json'

permissions:
  contents: read

jobs:
  verify-original-photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Collect pinned Commons originals (research-only)
        id: originals
        continue-on-error: true
        run: node scripts/preview-commons-originals.mjs
      - name: Summarize verified photograph originals
        if: always()
        run: |
          if [ -f .grid-atlas/media-review/status.json ]; then
            node -e '
              const fs=require("node:fs");
              const data=JSON.parse(fs.readFileSync(".grid-atlas/media-review/status.json","utf8"));
              const nl=String.fromCharCode(10);
              const summary=[
                "### Original photographic evidence (NOT publication approval)",
                "",
                "Verified originals: **"+data.entries.filter(x=>x.success).length+"/"+data.entries.length+"**",
                "",
                ...data.entries.map(x=>"- "+x.id+": "+(x.success?"checksum verified":"BLOCKED — "+x.error)),
                "",
                "Research-only artifact. No production publication or rights approval."
              ].join(nl);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary+nl);
            '
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: grid-atlas-research-photo-contact-sheet
          path: .grid-atlas/media-review/
          if-no-files-found: error
          retention-days: 7
      - name: Fail closed if a source original is not verified
        if: steps.originals.outcome != 'success'
        run: exit 1
