name: Commons originals SHA-256 research (unpublished)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which pinned originals to inspect (manual only; respect Commons rate limits)'
        required: true
        type: choice
        default: pending-three
        options:
          - pending-three
          - mclaren-only
          - ferrari-only
          - silverstone-only
          - all-five

permissions:
  contents: read

jobs:
  inspect-pinned-originals:
    name: Research-only Commons original verification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Check offline Commons evidence and report tests
        run: |
          node scripts/audit-commons-evidence.mjs
          node --test tests/commons-research-report.test.mjs tests/commons-local-originals-audit.test.mjs tests/commons-incremental-report.test.mjs
      - name: Download and inspect selected pinned originals in private ephemeral storage
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d "$RUNNER_TEMP/grid-atlas-originals.XXXXXXXX")"
          chmod 700 "$private_dir"
          trap 'rm -rf -- "$private_dir"' EXIT
          case "${{ inputs.scope }}" in
            pending-three)
              ids="research-mclaren-mp44-2007,research-ferrari-f2004-2004,research-silverstone-2019"
              ;;
            mclaren-only)
              ids="research-mclaren-mp44-2007"
              ;;
            ferrari-only)
              ids="research-ferrari-f2004-2004"
              ;;
            silverstone-only)
              ids="research-silverstone-2019"
              ;;
            all-five)
              ids="research-schumacher-portrait-2007,research-alonso-2024,research-mclaren-mp44-2007,research-ferrari-f2004-2004,research-silverstone-2019"
              ;;
            *) echo "Invalid research scope" >&2; exit 1 ;;
          esac
          node scripts/ingest-commons-batch.mjs \
            --ids "$ids" \
            --output-dir "$private_dir" > "$RUNNER_TEMP/commons-batch.json"
          node scripts/build-commons-incremental-report.mjs \
            --batch-report "$RUNNER_TEMP/commons-batch.json" \
            --output "$RUNNER_TEMP/commons-incremental-sha256.json"
          if [[ "${{ inputs.scope }}" == "all-five" ]]; then
            node scripts/build-commons-research-report.mjs \
              --batch-report "$RUNNER_TEMP/commons-batch.json" \
              --output "$RUNNER_TEMP/commons-research-sha256.json"
          fi
      - name: Archive metadata only (never original image bytes)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unpublished-commons-sha256-research
          path: |
            ${{ runner.temp }}/commons-batch.json
            ${{ runner.temp }}/commons-research-sha256.json
            ${{ runner.temp }}/commons-incremental-sha256.json
          if-no-files-found: warn
          retention-days: 7
