name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate foundation
        run: npm run check
      - name: Install workspace dependencies for localization tests
        run: |
          corepack enable && corepack prepare pnpm@10.18.3 --activate
          pnpm install --frozen-lockfile
      - name: Run foundation tests
        run: npm test
      - name: Run all offline Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Audit repository assets (read-only)
        run: python3 scripts/audit-repository-assets.py --json > /tmp/grid-atlas-repository-audit.json
      - name: Validate local documentation links
        run: python3 scripts/audit-doc-links.py --json
