name: Next.js web
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'packages/database/**'
      - 'tests/browser/**'
      - 'playwright.config.ts'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'packages/database/**'
      - 'tests/browser/**'
      - 'playwright.config.ts'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grid_atlas
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: grid_atlas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U grid_atlas -d grid_atlas"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://grid_atlas:integration_only@localhost:5432/grid_atlas
      GRID_ATLAS_NEXT_DIST_DIR: .next-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.18.3 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL client, Chromium and WebKit
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pnpm exec playwright install --with-deps chromium webkit
      - name: Lint and typecheck
        run: pnpm lint && pnpm typecheck
      - name: Build Next.js frontend
        env:
          API_BASE_URL: http://127.0.0.1:3001
        run: pnpm build
      - name: Test desktop and mobile archive flows over HTTP and PostgreSQL
        run: pnpm exec playwright test
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
