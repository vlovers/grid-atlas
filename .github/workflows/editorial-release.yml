name: Editorial release preflight
on:
  pull_request:
    paths:
      - 'docs/editorial/**'
      - 'scripts/editorial_release.py'
      - 'scripts/editorial_dossiers.py'
      - 'scripts/editorial_review.py'
      - 'scripts/reconcile-editorial-event-leads.py'
      - 'scripts/audit-editorial-event-candidates.py'
      - 'scripts/audit-editorial-archive-matches.py'
      - 'tests/test_editorial_archive_matches.py'
      - 'scripts/audit-editorial-chapter-coverage.py'
      - 'scripts/audit-editorial-season-chapters.py'
      - 'scripts/audit-editorial-season-chapters-batch-2.py'
      - 'scripts/audit-editorial-coverage-current.py'
      - 'tests/test_editorial_chapter_coverage.py'
      - 'tests/test_editorial_season_chapters.py'
      - 'tests/test_editorial_season_chapters_batch_2.py'
      - 'tests/test_editorial_reconcile_event_leads.py'
      - 'tests/test_editorial_event_candidates.py'
      - 'tests/test_editorial_release.py'
      - '.github/workflows/editorial-release.yml'
  push:
    branches: [main]
    paths:
      - 'docs/editorial/**'
      - 'scripts/editorial_release.py'
      - 'scripts/editorial_dossiers.py'
      - 'scripts/editorial_review.py'
      - 'scripts/audit-editorial-chapter-coverage.py'
      - 'scripts/audit-editorial-season-chapters.py'
      - 'scripts/audit-editorial-season-chapters-batch-2.py'
      - 'scripts/audit-editorial-coverage-current.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate the entire bilingual manuscript and research inventory
        run: |
          python3 scripts/audit-editorial-archive-matches.py
          python3 -m unittest discover -s tests -p 'test_editorial_archive_matches.py' -v
          python3 scripts/audit-editorial-coverage-current.py
          python3 scripts/audit-editorial-chapter-coverage.py
          python3 scripts/audit-editorial-season-chapters.py
          python3 scripts/audit-editorial-season-chapters-batch-2.py
          python3 -m unittest discover -s tests -p 'test_editorial_coverage_current.py' -v
          python3 -m unittest discover -s tests -p 'test_editorial_chapter_coverage.py' -v
          python3 -m unittest discover -s tests -p 'test_editorial_season_chapters.py' -v
          python3 -m unittest discover -s tests -p 'test_editorial_season_chapters_batch_2.py' -v
      - name: Download the pinned archive and published checksum
        run: |
          mkdir -p /tmp/editorial-f1db
          curl --fail --location --retry 3 https://github.com/f1db/f1db/releases/download/v2026.17.0/checksums_sha256.txt -o /tmp/editorial-f1db/checksums_sha256.txt
          curl --fail --location --retry 3 https://github.com/f1db/f1db/releases/download/v2026.17.0/f1db-json-splitted.zip -o /tmp/editorial-f1db/f1db-json-splitted.zip
      - name: Generate eleven real-archive event candidate reports
        run: |
          python3 -m unittest discover -s tests -p 'test_editorial_reconcile_event_leads.py' -v
          python3 -m unittest discover -s tests -p 'test_editorial_event_candidates.py' -v
          python3 scripts/reconcile-editorial-event-leads.py --archive /tmp/editorial-f1db/f1db-json-splitted.zip --checksums /tmp/editorial-f1db/checksums_sha256.txt --output editorial-event-candidates.json
          python3 scripts/audit-editorial-event-candidates.py editorial-event-candidates.json
      - name: Upload unapproved canonical event candidates
        uses: actions/upload-artifact@v4
        with:
          name: editorial-event-candidates-unapproved
          path: editorial-event-candidates.json
          retention-days: 14
          if-no-files-found: error
      - name: Validate all release identities, locales, evidence and unsigned review state
        run: |
          python3 scripts/editorial_release.py --archive /tmp/editorial-f1db/f1db-json-splitted.zip --checksums /tmp/editorial-f1db/checksums_sha256.txt > editorial-release-preflight.json
      - name: Upload readiness evidence (structural success is not editorial approval)
        uses: actions/upload-artifact@v4
        with:
          name: editorial-release-preflight
          path: editorial-release-preflight.json
          retention-days: 14
