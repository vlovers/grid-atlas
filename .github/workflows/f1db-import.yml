name: F1DB seasons import integration
on:
  pull_request:
    paths:
      - 'packages/data-importer/**'
      - 'packages/database/**'
      - 'scripts/f1db_relationships.py'
      - 'scripts/audit_f1db.py'
      - 'tests/test_import_seasons.py'
      - 'tests/test_import_drivers.py'
      - 'tests/test_import_teams_circuits.py'
      - 'tests/test_import_races.py'
      - 'tests/test_import_race_results.py'
      - 'scripts/editorial_career.py'
      - 'scripts/prepare_editorial_batch.py'
      - 'scripts/validate_editorial_batch.py'
      - 'scripts/editorial_batch_identity.py'
      - 'tests/test_editorial_batch_identity.py'
      - 'docs/editorial/batches/**'
      - 'tests/test_editorial_career.py'
      - 'tests/test_prepare_editorial_batch.py'
      - 'tests/test_editorial_batch.py'
      - '.github/workflows/f1db-import.yml'
  push:
    branches: [main]
    paths:
      - 'packages/data-importer/**'
      - 'packages/database/**'
      - 'scripts/f1db_relationships.py'
      - 'scripts/audit_f1db.py'
      - 'tests/test_import_seasons.py'
permissions:
  contents: read
jobs:
  seasons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grid_atlas
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: grid_atlas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U grid_atlas -d grid_atlas"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://grid_atlas:integration_only@localhost:5432/grid_atlas
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test importer fixtures
        run: |
          python3 -m unittest discover -s tests -p test_import_seasons.py -v
          python3 -m unittest discover -s tests -p test_import_drivers.py -v
          python3 -m unittest discover -s tests -p test_import_teams_circuits.py -v
          python3 -m unittest discover -s tests -p test_import_races.py -v
          python3 -m unittest discover -s tests -p test_import_race_results.py -v
      - name: Test editorial batch pipeline
        run: |
          python3 -m unittest discover -s tests -p test_editorial_batch.py -v
          python3 -m unittest discover -s tests -p test_prepare_editorial_batch.py -v
          python3 -m unittest discover -s tests -p test_editorial_career.py -v
          python3 -m unittest discover -s tests -p test_editorial_batch_identity.py -v
      - name: Download and check pinned release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/f1db
          base=https://github.com/f1db/f1db/releases/download/v2026.17.0
          curl -fLsS --retry 3 "$base/checksums_sha256.txt" -o /tmp/f1db/checksums_sha256.txt
          curl -fLsS --retry 3 "$base/f1db-json-splitted.zip" -o /tmp/f1db/f1db-json-splitted.zip
      - name: Validate priority editorial batch against pinned F1DB IDs
        run: python3 scripts/validate_editorial_batch.py docs/editorial/batches/priority-legends-001.json --archive /tmp/f1db/f1db-json-splitted.zip --checksums /tmp/f1db/checksums_sha256.txt
      - name: Reconcile all 30 Content Factory external IDs against pinned F1DB
        run: |
          python3 scripts/editorial_batch_identity.py \
            --archive /tmp/f1db/f1db-json-splitted.zip \
            --checksums /tmp/f1db/checksums_sha256.txt \
            --output /tmp/content-factory-30-identity.json
          python3 -c 'import json; x=json.load(open("/tmp/content-factory-30-identity.json")); assert x["totals"]["matched_external_ids"] == 30 and x["totals"]["approved_for_publication"] == 0 and not x["errors"]'
      - name: Upload Content Factory identity reconciliation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: content-factory-30-f1db-identity-unpublished
          path: /tmp/content-factory-30-identity.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Prepare unpublished priority driver research packets
        run: |
          python3 scripts/prepare_editorial_batch.py docs/editorial/batches/priority-legends-001.json --archive /tmp/f1db/f1db-json-splitted.zip --checksums /tmp/f1db/checksums_sha256.txt --output /tmp/priority-legends-001.research.json
          python3 -c 'import json; p=json.load(open("/tmp/priority-legends-001.research.json")); assert len(p["profiles"]) == 5 and p["publication_status"] == "unpublished" and all(not x["claims"] and all(v is None for v in x["drafts"].values()) for x in p["profiles"])'
      - name: Upload unpublished editorial research packets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: priority-legends-001-research-unpublished
          path: /tmp/priority-legends-001.research.json
          retention-days: 14
      - name: Verify Silverstone identities in pinned archive
        run: python3 packages/data-importer/audit_silverstone_release.py --archive /tmp/f1db/f1db-json-splitted.zip --checksums /tmp/f1db/checksums_sha256.txt
      - name: Migrate and import twice
        shell: bash
        run: |
          set -euo pipefail
          python3 packages/database/scripts/migrate.py
          for i in 1 2; do
            python3 packages/data-importer/import_seasons.py --archive /tmp/f1db/f1db-json-splitted.zip --checksums /tmp/f1db/checksums_sha256.txt
          done
          test "$(psql "$DATABASE_URL" -X -Atc 'SELECT count(*) FROM historical_seasons')" = 77
          test "$(psql "$DATABASE_URL" -X -Atc 'SELECT count(*) FROM source_releases')" = 1
          test "$(psql "$DATABASE_URL" -X -Atc 'SELECT min(year), max(year) FROM historical_seasons')" = '1950|2026'
      - name: Import drivers twice without duplicating records
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2; do
            python3 packages/data-importer/import_drivers.py --archive /tmp/f1db/f1db-json-splitted.zip --checksums /tmp/f1db/checksums_sha256.txt
          done
          test "$(psql "$DATABASE_URL" -X -Atc 'SELECT count(*) FROM historical_drivers')" = 917
          test "$(psql "$DATABASE_URL" -X -Atc "SELECT count(*) FROM external_identities WHERE entity_kind='driver'")" = 917
          test "$(psql "$DATABASE_URL" -X -Atc 'SELECT count(*) FROM source_observations')" = 917
      - name: Import constructors entrants and circuits twice
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2; do
            python3 packages/data-importer/import_teams_circuits.py --archive /tmp/f1db/f1db-json-splitted.zip --checksums /tmp/f1db/checksums_sha256.txt
          done
          test "$(psql "$DATABASE_URL" -X -Atc 'SELECT count(*) FROM historical_constructors')" = 187
          test "$(psql "$DATABASE_URL" -X -Atc 'SELECT count(*) FROM historical_entrants')" = 830
          test "$(psql "$DATABASE_URL" -X -Atc 'SELECT count(*) FROM historical_circuits')" = 78
          test "$(psql "$DATABASE_URL" -X -Atc 'SELECT count(*) FROM source_observations')" = 2012
      - name: Resolve Silverstone constructors from imported source identities
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $audit$
          DECLARE expected text[] := ARRAY['jordan','midland','spyker','force-india','racing-point','aston-martin'];
          DECLARE resolved integer;
          BEGIN
            SELECT count(*) INTO resolved
            FROM historical_constructors c
            JOIN external_identities x ON x.id=c.external_identity_id
            JOIN data_sources s ON s.id=x.source_id
            WHERE s.slug='f1db' AND x.entity_kind='constructor'
              AND x.external_id = ANY(expected);
            IF resolved <> array_length(expected,1) THEN
              RAISE EXCEPTION 'Expected 6 source-qualified Silverstone constructors, found %', resolved;
            END IF;
            IF EXISTS (
              SELECT 1 FROM unnest(expected) AS ident(id)
              WHERE (SELECT count(*) FROM historical_constructors c
                JOIN external_identities x ON x.id=c.external_identity_id
                JOIN data_sources s ON s.id=x.source_id
                WHERE s.slug='f1db' AND x.entity_kind='constructor' AND x.external_id=ident.id) <> 1
            ) THEN
              RAISE EXCEPTION 'Silverstone constructor identity missing or duplicated';
            END IF;
          END $audit$;
          SQL
      - name: Preflight and import proposed 2021 lineage into disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          python3 packages/database/scripts/audit-lineage-manifest-identities.py docs/data-sources/manifests/silverstone-2021.proposed.json
          python3 packages/database/scripts/import-proposed-lineage.py docs/data-sources/manifests/silverstone-2021.proposed.json
          python3 packages/database/scripts/import-proposed-lineage.py docs/data-sources/manifests/silverstone-2021.proposed.json
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $assert$
          BEGIN
            IF (SELECT count(*)
                FROM historical_lineage_claims c
                JOIN historical_constructors a ON a.id=c.subject_constructor_id
                JOIN external_identities ax ON ax.id=a.external_identity_id
                JOIN historical_constructors b ON b.id=c.object_constructor_id
                JOIN external_identities bx ON bx.id=b.external_identity_id
                WHERE ax.external_id='racing-point' AND bx.external_id='aston-martin'
                  AND c.relation_type='renamed_to' AND c.effective_year=2021
                  AND c.review_status='proposed') <> 1 THEN
              RAISE EXCEPTION 'Expected exactly one proposed 2021 Racing Point rename';
            END IF;
            IF EXISTS (SELECT 1 FROM historical_lineage_claims WHERE review_status='verified')
              OR EXISTS (SELECT 1 FROM historical_entrant_lineage_claims WHERE review_status='verified') THEN
              RAISE EXCEPTION 'Import must never auto-verify lineage';
            END IF;
          END $assert$;
          SQL
      - name: Import historical races twice
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2; do
            python3 packages/data-importer/import_races.py --archive /tmp/f1db/f1db-json-splitted.zip --checksums /tmp/f1db/checksums_sha256.txt
          done
          test "$(psql "$DATABASE_URL" -X -Atc 'SELECT count(*) FROM historical_races')" = 1172
          test "$(psql "$DATABASE_URL" -X -Atc "SELECT count(*) FROM external_identities WHERE entity_kind='race'")" = 1172
          test "$(psql "$DATABASE_URL" -X -Atc 'SELECT count(*) FROM source_observations')" = 3184
      - name: Import race results twice
        shell: bash
        run: |
          set -euo pipefail
          python3 packages/database/scripts/migrate.py
          for i in 1 2; do
            python3 packages/data-importer/import_race_results.py --archive /tmp/f1db/f1db-json-splitted.zip --checksums /tmp/f1db/checksums_sha256.txt
          done
          test "$(psql "$DATABASE_URL" -X -Atc 'SELECT count(*) FROM historical_race_results')" = 27665
          test "$(psql "$DATABASE_URL" -X -Atc 'SELECT count(*) FROM historical_race_results WHERE driver_id IS NULL OR race_id IS NULL OR constructor_id IS NULL')" = 0
      - name: Export Senna and Prost 1988 reconciliation from pinned F1DB import
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/grid-atlas-evidence
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f packages/database/scripts/senna-1988-reconciliation.sql > /tmp/grid-atlas-evidence/senna-prost-1988.txt
          test -s /tmp/grid-atlas-evidence/senna-prost-1988.txt
      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: senna-prost-1988-f1db-reconciliation
          path: /tmp/grid-atlas-evidence/senna-prost-1988.txt
          retention-days: 30
