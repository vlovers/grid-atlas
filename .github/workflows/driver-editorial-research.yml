name: Driver story editorial research checks

on:
  pull_request:
    paths:
      - 'docs/editorial/driver-arcs/**'
      - 'tests/test_driver_story_overlooked.py'
      - '.github/workflows/driver-editorial-research.yml'
  push:
    branches: [main]
    paths:
      - 'docs/editorial/driver-arcs/**'
      - 'tests/test_driver_story_overlooked.py'
      - '.github/workflows/driver-editorial-research.yml'

permissions:
  contents: read

jobs:
  bilingual-structure-and-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check ten bilingual driver manuscripts (not historical approval)
        run: python3 -m unittest tests/test_driver_story_overlooked.py -v
