services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grid_atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grid_atlas_local}
      POSTGRES_DB: ${POSTGRES_DB:-grid_atlas}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - grid-atlas-postgres:/var/lib/postgresql/data

volumes:
  grid-atlas-postgres:
